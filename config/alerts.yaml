# config/alerts.yaml - owner: data-scientist (T-021..T-024b, T-047).
# Contract: docs/contracts/schemas/config/alerts.schema.json (model AlertsConfig, pipeline/common/models.py).
#
# Every parameter: value, origin (sourced | calibrated | estimated | design | pending), source or reason,
# last_changed; `estimated` also names estimated_by and the TASKS.md item that replaces it (Rule zero).
# Weights and W thresholds are the SPEC starting values with origin `design` (D-024: "engineering choice; no expert
# AHP matrix available"); changing them is class A (PENDING.md). Severe is 0.90 since D-029. Their stability is checked by the +/-0.10 weight
# sensitivity check (T-024b, app/public/data/demo/verification.json). Calibration uses press-documented floods only
# (D-024); the only calibrated value is travel_lag_days. Nothing waits on a human expert (D-022): `estimated` values
# point at T-047 (agents look for opened sources).
# Units are SI (ADR-002); `unit` names them.

weights:
  upstream: {value: 0.35, origin: design, reason: "engineering choice; no expert AHP matrix available (D-024). SPEC starting weight of upstream rain (docs/spec/12); stability checked by the +/-0.10 sensitivity check (T-024b).", last_changed: 2026-11-15}
  saturation: {value: 0.25, origin: design, reason: "engineering choice; no expert AHP matrix available (D-024). SPEC starting weight of soil saturation (antecedent precipitation index; no SMAP, D-019) (docs/spec/12); stability checked by the +/-0.10 sensitivity check (T-024b).", last_changed: 2026-11-15}
  terrain: {value: 0.20, origin: design, reason: "engineering choice; no expert AHP matrix available (D-024). SPEC starting weight of terrain wetness (TWI rank within the farm) (docs/spec/12); stability checked by the +/-0.10 sensitivity check (T-024b).", last_changed: 2026-11-15}
  local: {value: 0.10, origin: design, reason: "engineering choice; no expert AHP matrix available (D-024). SPEC starting weight of local 24 h rain (docs/spec/12); stability checked by the +/-0.10 sensitivity check (T-024b).", last_changed: 2026-11-15}
  balance: {value: 0.10, origin: design, reason: "engineering choice; no expert AHP matrix available (D-024). SPEC starting weight of the 7-day water balance (rain minus ETc) (docs/spec/12); stability checked by the +/-0.10 sensitivity check (T-024b).", last_changed: 2026-11-15}

levels:
  watch: {value: 0.40, origin: design, reason: "Escalation threshold of W for Watch (docs/spec/12 severity table, docs/spec/16 state diagram). Not calibrated: 4 press-documented floods cannot fit a threshold; evidence table in the data-scientist report and PENDING.md P-014.", last_changed: 2026-11-15}
  warning: {value: 0.60, origin: design, reason: "Escalation threshold of W for Warning (docs/spec/12 severity table, docs/spec/16 state diagram). Not calibrated: 4 press-documented floods cannot fit a threshold; evidence table in the data-scientist report and PENDING.md P-014.", last_changed: 2026-11-15}
  severe: {value: 0.90, origin: design, reason: "Severe starts at W >= 0.90: design choice made after viewing the 2026 replay to make Severe rarer (wettest demo lot Severe on 13% of days in 2016-2025 instead of 27%); not fitted or validated; the 2026 floods were seen when choosing it (D-029; SPEC starting value 0.80).", last_changed: 2026-11-15}

deescalate:
  watch: {value: 0.30, origin: design, reason: "Hysteresis: leave Watch only when W falls 0.10 below its threshold (docs/spec/12 anti-noise rules; docs/spec/16 Watch -> Normal at W < 0.30).", last_changed: 2026-11-14}
  warning: {value: 0.50, origin: design, reason: "Hysteresis (docs/spec/16 Warning -> Watch at W < 0.50).", last_changed: 2026-11-14}
  severe: {value: 0.80, origin: design, reason: "Hysteresis: Severe -> Warning when W falls 0.10 below the Severe threshold (SPEC rule, docs/spec/12; D-029 keeps the 0.10 gap, scientist-reviewer T-025 agrees).", last_changed: 2026-11-15}

severe_confirmations: {value: 2, origin: design, reason: "Severe needs W >= levels.severe on two consecutive updates so one noisy rain estimate emails nobody (docs/spec/12, 16).", last_changed: 2026-11-14}
stale_after_hours: {value: 12, origin: design, unit: h, reason: "A unit whose newest rain data is older than 12 h is Stale and never emails (docs/spec/12, 16).", last_changed: 2026-11-14}
waterlogging_days_floor_warning: {value: 2, origin: sourced, unit: d, source: "team agronomist, 14 Nov 2026: banana tolerates at most 2 days of waterlogging (domain/thresholds.yaml; D-023)", notes: "Rule (docs/spec/12): 2 consecutive positive-balance days on a top-tercile unit set a floor of Warning. Applied on the climatic balance P - ETc because no drainage term will exist (drainage_mm_per_day pending, D-022); this over-states waterlogging pressure, so the floor errs toward warning.", last_changed: 2026-11-15}
root_depth_cm: {value: 70, origin: sourced, unit: cm, source: "team agronomist, 14 Nov 2026: banana roots at 70 cm (domain/thresholds.yaml; D-023)", notes: "Not used by the engine yet: the balance has no drainage term until drainage_mm_per_day is known.", last_changed: 2026-11-14}
api_k: {value: 0.90, origin: estimated, estimated_by: "SPEC Prediction science method 5 (Kohler & Linsley 1951: k between 0.85 and 0.98, 0.90 common)", reason: "k is site-specific; 0.90 is the SPEC's common value. The cited NWS PDF was not opened by data-scientist, so the value is not marked sourced. Calibrate against observed wetness when any exists.", task_id: T-047, last_changed: 2026-11-14}
curve_number_by_cover_soil: {value: null, origin: pending, reason: "No land-cover or hydrologic-soil-group layer is ingested for the catchment, so no curve number can be read from NEH 630 tables. runoff_upstream_mm stays null and the upstream indicator uses the 72 h catchment rain; for a fixed CN, runoff has the same percentile rank as rain only above Ia (below Ia every rain total gives Q = 0, a tie).", task_id: T-047, last_changed: 2026-11-15}
travel_lag_hours: {value: 4.18, origin: estimated, unit: h, estimated_by: "data-scientist: Kirpich (1940) tc on SRTM (see kirpich below)", reason: "First estimate only (docs/spec/09 method 4), used beyond Kirpich's calibration range (basins of 1 to 112 acres per the pages the scientist-reviewer opened in T-025; this catchment is about 254 km2, some 560 times larger). The engine uses travel_lag_days. Hours cannot be calibrated with the daily IMERG product.", task_id: T-047, last_changed: 2026-11-15}
travel_lag_days: {value: 0, origin: calibrated, unit: d, source: "Calibration note in docs/reports/data-scientist/2026-11-15-0450.md and its follow-up: El Universo, 23 Feb 2026 (published 09:54 local; opened 2026-11-14) reports rain from Sunday night 22 Feb into the early hours of Monday 23 Feb and the Rio Buenavista overflow at the Buenavista-Pasaje road; the overflow hour is not given, only that it happened before publication. The catchment-mean IMERG Early peak falls on UTC 23 Feb (58.58 mm; 4.09 mm on 02-22, 11.48 mm on 02-24), the same UTC day (Sunday 19:00 local = 00:00 UTC 23 Feb). Lag < 1 day at daily resolution: consistent with this one event, not contradicted by Kirpich. In-sample: the same event is used for verification. The October 2026 events are on other rivers.", last_changed: 2026-11-15}

sigatoka:
  t_mean_c: {value: 23, origin: estimated, unit: "°C", estimated_by: "research proposal of the team agronomist, D-023 (domain/thresholds.yaml sigatoka_watch_mean_temp_c)", reason: "Favourable when daily mean temperature is above this value (docs/spec/12). Experimental side indicator (D-024).", task_id: T-047, last_changed: 2026-11-14}
  rh_mean: {value: 0.75, origin: estimated, estimated_by: "research proposal of the team agronomist, D-023 (domain/thresholds.yaml sigatoka_watch_rh_pct)", reason: "Favourable when daily mean relative humidity is above 75 % (stored as a 0..1 fraction). Experimental (D-024).", task_id: T-047, last_changed: 2026-11-14}
  rh_unfavourable: {value: 0.70, origin: estimated, estimated_by: "research proposal of the team agronomist, D-023 (domain/thresholds.yaml sigatoka_unfavourable_rh_pct)", reason: "Mean RH below 70 % is unfavourable for the disease. Experimental (D-024).", task_id: T-047, last_changed: 2026-11-14}
  days: {value: 3, origin: estimated, unit: d, estimated_by: "research proposal of the team agronomist, D-023 (domain/thresholds.yaml sigatoka_watch_consecutive_days)", reason: "Watch after 3 consecutive favourable days with rain (rain read as > 0 mm IMERG that UTC day). Experimental (D-024).", task_id: T-047, last_changed: 2026-11-14}
  leaf_wet_rh: {value: 0.90, origin: estimated, estimated_by: "SPEC Prediction science method 8 (Sentelhas et al. 2008, hours with RH >= 90 %)", reason: "The cited paper was not opened by data-scientist; local thresholds improve the method (SPEC limit). Experimental (D-024).", task_id: T-047, last_changed: 2026-11-14}

cold:
  base_c: {value: 14, origin: estimated, unit: "°C", estimated_by: "research proposal of the team agronomist, D-023 (domain/thresholds.yaml heat_unit_base_temp_c)", reason: "Base temperature of banana heat units (docs/spec/09 method 10). Experimental (D-024).", task_id: T-047, last_changed: 2026-11-14}
  weekly_threshold_rule: {value: null, origin: pending, reason: "No sourced cold-stress threshold. The literal rule '7-day heat-unit sum below the same-week climatological mean' flagged about half of all days in every month (scientist-reviewer T-025 M4), so no cold-stress level is shown; daily heat units are shown as a number only (experimental, D-024).", task_id: T-047, last_changed: 2026-11-15}

# ---- Further engine parameters (extra top-level keys, CONTRACTS.md §5) --------------------------------------

kc_banana: {value: 1.10, origin: estimated, estimated_by: "data-scientist from FAO-56 Table 12 (opened https://www.fao.org/4/x0490e/x0490e0b.htm on 2026-11-14)", reason: "Single crop coefficient for ETc = Kc x ETo: FAO-56 Table 12, Banana 1st year, Kc mid = 1.10 (Kc ini 0.50, Kc end 1.00; 2nd year 1.00 / 1.20 / 1.10). Plant age of the demo lots is unknown (questionnaire closed, D-022/D-023), so the year-one mid-season value the SPEC refers to is used. Table 12 values are for a sub-humid climate (RHmin about 45 %, u2 about 2 m/s) and are not climate-adjusted (FAO-56 eq. 62 needs RHmin, which the POWER daily file does not hold). The SPEC quotes Table 17 (basal Kcb about 1.05), which excludes soil evaporation; the single Kc is the coefficient of ETc = Kc x ETo. Commercial ratoon plantations are closer to the 2nd-year row (Kc mid 1.20), so this value may under-state ETc (scientist-reviewer T-025 m4).", task_id: T-047, last_changed: 2026-11-15}
drainage_mm_per_day: {value: null, origin: pending, unit: mm/d, reason: "D in Delta S = P - ETc - D needs drainage class, drain depth and spacing; none is known, no expert input will come (D-022) and no opened source gives a number. The engine's balance is P - ETc (D not subtracted, labelled), which over-states waterlogging pressure.", task_id: T-047, last_changed: 2026-11-14}

kirpich:
  length_m: {value: 47995, origin: sourced, unit: m, source: "SRTMGL1 v003 (provenance prov-catchment-buenavista-srtm): longest D8 path to the outlet on the OSM-burned routing surface; `uv run python -m pipeline.engine kirpich` (re-delineated area 253.79 km2 vs published 253.8 km2)", last_changed: 2026-11-14}
  drop_m: {value: 2346.0, origin: sourced, unit: m, source: "SRTMGL1 v003, unburned DEM: 2361.5 m at the most remote cell (-79.67526, -3.53583) minus 15.5 m at the outlet (-79.87825, -3.37654)", last_changed: 2026-11-14}
  slope_m_per_m: {value: 0.04888, origin: sourced, unit: m/m, source: "drop_m / length_m along the longest flow path (SRTMGL1 v003)", last_changed: 2026-11-14}
  tc_minutes: {value: 250.7, origin: estimated, unit: min, estimated_by: "data-scientist: tc = 0.0195 L^0.77 S^-0.385 (Kirpich 1940, docs/spec/09 method 4)", reason: "Kirpich was derived on small steep Tennessee watersheds (1 to 112 acres); this 254 km2 catchment is far outside that range, so the value is a first guess only.", task_id: T-047, last_changed: 2026-11-15}

engine:
  upstream_window_hours: {value: 72, origin: design, unit: h, reason: "The upstream indicator is the catchment rain of the last 72 h (SPEC 'last 24-72 h'; 72 h matches the event ranking of T-013), shifted by the travel lag in whole days.", last_changed: 2026-11-14}
  local_window_hours: {value: 24, origin: design, unit: h, reason: "Local rain of the last 24 h (docs/spec/12): one IMERG Early UTC day over the farm cell.", last_changed: 2026-11-14}
  balance_window_days: {value: 7, origin: design, unit: d, reason: "7-day water balance (docs/spec/12).", last_changed: 2026-11-14}
  percentile_min_history_days: {value: 365, origin: design, unit: d, reason: "A percentile needs at least one year of earlier values, so every season is in the history; before that the indicator is missing.", last_changed: 2026-11-14}
  percentile_method: {value: "mid-rank against strictly earlier days: (count below + half the ties) / count", origin: design, reason: "No look-ahead in replay; ties (many dry days) are split so a dry day does not rank as wet.", last_changed: 2026-11-14}
  state_start: {value: "2016-01-01", origin: design, reason: "The state machine starts at Normal on the first day all percentiles exist (365 days after the IMERG record starts on 2015-01-01) and runs daily, so the replay window starts from a settled state.", last_changed: 2026-11-14}
  update_time: {value: "end of the UTC day of the newest IMERG Early daily value + imerg_early_latency_hours", origin: design, reason: "The replay has one update per UTC day. newest_rain_data_at is the end of that UTC day; the update (updated_at, event time) is at the earliest that time plus the IMERG Early latency, so a day's rain reaches W no sooner than 04:00 UTC the next day (scientist-reviewer T-025 M1).", last_changed: 2026-11-15}
  imerg_early_latency_hours: {value: 4, origin: sourced, unit: h, source: "config/datasets.yaml imerg_early_daily latency: 'Early Run, 4-h latency (IMERG family abstract in CMR)' (verified by data-engineer, T-010)", notes: "Latency of the half-hourly Early run; the daily file may come later, so 4 h is the earliest possible update.", last_changed: 2026-11-15}
  cold_climatology_min_years: {value: 5, origin: design, unit: yr, reason: "Kept for the cold-stress function (pipeline/engine/side.py); no cold-stress level is produced while cold.weekly_threshold_rule is pending.", last_changed: 2026-11-15}

verification:
  alert_level: {value: "severe", origin: design, reason: "An alert, for verification, is a unit at Severe (the level that emails, docs/spec/12).", last_changed: 2026-11-14}
  days_before: {value: 1, origin: design, unit: d, reason: "An alert on the UTC day before a documented flood counts as a hit (early warning).", last_changed: 2026-11-14}
  days_after: {value: 1, origin: design, unit: d, reason: "Floods are reported in local dates (UTC-5); a local day ends at 05:00 UTC the next day, so one UTC day after the reported end is included.", last_changed: 2026-11-14}
