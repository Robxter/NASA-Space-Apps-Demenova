# config/alerts.yaml - owner: data-scientist (T-021..T-023, T-041). Stub written by lead-architect in phase 0.
# Contract: docs/contracts/schemas/config/alerts.schema.json (model AlertsConfig, pipeline/common/models.py).
#
# Keys only. Every parameter is `value: null, origin: pending` (Rule zero, CLAUDE.md §1). data-scientist
# fills each one from the SPEC "Risk engine and weighted alerts" and "Prediction science" sections with
# origin sourced | calibrated | estimated | design and its source or reason, then updates last_changed.
# Setting or changing any weight or threshold is class A (CLAUDE.md §6): PENDING.md first.
# Units are SI (ADR-002): put the unit in `unit` when the value is filled.
# Further engine parameters may be added as extra top-level keys holding a parameter or a map of parameters.

