# config/datasets.yaml - owner: data-engineer (T-010, verified 2026-11-14 by data-engineer).
# Contract: docs/contracts/schemas/config/datasets.schema.json (model DatasetsConfig, pipeline/common/models.py).
#
# Rule zero (CLAUDE.md §1): an entry is `origin: sourced` only when its identifiers were read on an official page
# or official metadata record that was actually opened (url_opened). Fields the page did not state stay null.
# Entries that could not be verified stay `origin: pending` with every identifier null.
#
# NASA collections were verified against NASA CMR (Common Metadata Repository) UMM-C records, the official metadata
# behind Earthdata Search; GES DISC landing pages render only with JavaScript and returned no text.
# `key` is Demenova's own name for the dataset, never a provider identifier.
# `use_in_demenova` is quoted from the SPEC "Data architecture" table (docs/spec/10-data-architecture.md),
# except gibs (docs/spec/11-stack-and-deployment.md). Global datasets only; US-only sources are forbidden.

datasets:
  - key: imerg
    provider: "NASA GES DISC"
    short_name: GPM_3IMERGHHE
    version: "07"
    url_opened: "https://cmr.earthdata.nasa.gov/search/collections.umm_json?short_name=GPM_3IMERGHHE&version=07"
    accessed: 2026-11-14
    spatial_res: "0.1 x 0.1 degree (roughly 10 x 10 km)"
    temporal_res: "half-hourly"
    latency: "Early Run, 4-h latency"
    variables: null
    use_in_demenova: "Alert trigger: upstream and local rain"
    verified_by: data-engineer
    origin: sourced
    notes: "IMERG Early Run, half-hourly, V07 (CMR concept C2723758340-GES_DISC, DOI 10.5067/GPM/IMERG/3B-HH-E/07, status ACTIVE). Latency also on https://gpm.nasa.gov/data/imerg ('4 hours'). Variable names to be read from the first downloaded file. Download needs Earthdata login."

