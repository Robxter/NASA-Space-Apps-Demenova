<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-labelledby="t">
  <title id="t">Demenova, option 1: Core</title>
  <defs>
    <clipPath id="core"><rect width="160" height="200" rx="38"/></clipPath>
  </defs>
  <!-- Mark: a soil core in section. Space, Earth's limb seen from orbit, banana-leaf ground, root-zone water. -->
  <g clip-path="url(#core)">
    <rect width="160" height="200" fill="#0E2135"/>
    <path d="M0 120 Q80 98 160 120 V200 H0Z" fill="#2A6343"/>
    <g fill="none" stroke="#9ED8DE" stroke-width="6" stroke-linecap="round">
      <path d="M30 150 q12.5 -7 25 0 t25 0 t25 0 t25 0"/>
      <path d="M44 174 q12 -6 24 0 t24 0 t24 0"/>
    </g>
  </g>
  <!-- Nova: six-spike diffraction star, as an orbiting telescope sees a star. -->
  <g fill="#F4DF8E">
    <path d="M80 30 L83.8 60 L80 90 L76.2 60Z"/>
    <path d="M80 30 L83.8 60 L80 90 L76.2 60Z" transform="rotate(60 80 60)"/>
    <path d="M80 30 L83.8 60 L80 90 L76.2 60Z" transform="rotate(-60 80 60)"/>
    <path d="M63 60 L80 62 L97 60 L80 58Z"/>
    <circle cx="80" cy="60" r="5.5"/>
  </g>
  <text x="196" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="600" letter-spacing="-1.5" fill="#0E2135">Demenova</text>
</svg>
