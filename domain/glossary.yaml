  - term_id: nivel_freatico
    term: {es: "Nivel freático", en: "Water table"}
    definition:
      es: "Profundidad a la que el suelo está saturado de agua; si sube a menos de 70 cm por más de 2 días, daña las raíces."
      en: "Depth at which the soil is saturated; if it rises above 70 cm depth for more than 2 days, roots are damaged."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Standard term pending Tyson's local vocabulary (5.6); damage line from Tyson's values (review queue Q-01)."
    task_id: T-061
    approved_by: null

  - term_id: crecida
    term: {es: "Crecida o desborde del río", en: "River overflow"}
    definition:
      es: "Agua de lluvia caída en la parte alta de la cuenca que llega horas o días después y se sale del cauce."
      en: "Rain that fell in the upper catchment arriving hours or days later and leaving the river channel."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Standard term; meaning from Tyson's field problems (water arriving from the highlands hours or days later). Local word pending (5.6)."
    task_id: T-061
    approved_by: null

  - term_id: mani_forrajero
    term: {es: "Maní forrajero", en: "Pinto peanut (Arachis pintoi)"}
    definition:
      es: "Leguminosa perenne rastrera (Arachis pintoi) que forma una cobertura densa; se usa como cobertura viva en algunas fincas bananeras."
      en: "Perennial creeping legume (Arachis pintoi) that forms a dense cover; some banana farms use it as living cover."
    origin: estimated
    source: "https://en.wikipedia.org/wiki/Arachis_pintoi"
    accessed: 2026-11-14
