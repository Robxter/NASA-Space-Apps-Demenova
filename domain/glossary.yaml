  - term_id: mani_forrajero
    term: {es: "Maní forrajero", en: "Pinto peanut (Arachis pintoi)"}
    definition:
      es: "Leguminosa forrajera (Arachis pintoi) usada como cobertura del suelo; se reporta alto potencial como cobertura en banano, con establecimiento lento y posible competencia por nutrientes."
      en: "Forage legume (Arachis pintoi) used as ground cover; reported to have high potential as a cover crop in banana, with slow establishment and possible competition for nutrients."
    origin: sourced
    source: "https://agris.fao.org/search/es/records/6471eeb177fd37171a71944e"
    accessed: 2026-11-15
    reason: "De la Cruz, Suarez and Ferguson (1994), CIAT, abstract in FAO AGRIS, opened 2026-11-15."
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none

  - term_id: micorrizas
    term: {es: "Micorrizas", en: "Mycorrhizae"}
    definition:
      es: "Hongos del suelo que se asocian con las raíces. El banano es una planta micorrízica, pero su beneficio en campo sigue en gran parte sin conocerse. En la estrategia C se aplican con el suelo no saturado."
      en: "Soil fungi that associate with roots. Banana is a mycorrhizal plant, but the field benefit remains largely unknown. In strategy C they are applied on unsaturated soil."
    origin: sourced
    source: "https://ishs.org/ishs-article/879_52/"
    accessed: 2026-11-15
    reason: "Jefwa et al. (2010), Acta Horticulturae 879, abstract opened 2026-11-15. The strategy C timing is the draft design, not a sourced effect."
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none

