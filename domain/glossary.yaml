  - term_id: drenaje
    term: {es: "Drenaje", en: "Drainage"}
    definition:
      es: "Canales y salidas que sacan el exceso de agua del lote."
      en: "Ditches and outlets that remove excess water from the lot."
    origin: estimated
    estimated_by: questionnaire-default
