# domain/glossary.yaml - agronomic terms (owner: agronomist agent).
# Schema: docs/contracts/schemas/domain/glossary.schema.json; model: pipeline/common/models.py GlossaryFile.
# Questionnaire 5.6 (local vocabulary) is closed: standard Spanish terms are the v1 values (encharcamiento, lote,
# drenaje, inundación), origin estimated, "team agronomist left; default retained". Definitions without an opened
# source carry the label "General guidance — not reviewed by an agronomist" in `reason` (the Learn screen shows
# every card as general guidance). Every item: reviewed_by [agronomist-agent, scientist-reviewer], human_review none.
# Fusarium TR4: no recommendation of our own; the only text is one neutral line to Agrocalidad, Ecuador's official
# plant-health agency, whose page was opened (D-025).

terms:

  - term_id: encharcamiento
    term: {es: "Encharcamiento", en: "Waterlogging"}
    definition:
      es: "Suelo saturado de agua, con el nivel freático dentro de la zona de raíces (70 cm). El banano tolera como máximo 2 días."
      en: "Soil saturated with water, with the water table inside the root zone (70 cm). Banana tolerates 2 days at most."
    origin: estimated
    source: "team agronomist, 14 Nov 2026"
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.6: team agronomist left; default retained. General guidance — not reviewed by an agronomist; the 2 days and 70 cm are from the closed archive."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none

