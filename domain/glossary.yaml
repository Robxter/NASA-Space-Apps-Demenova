terms:

  - term_id: encharcamiento
    term: {es: "Encharcamiento", en: "Waterlogging"}
    definition:
      es: "Suelo saturado de agua, con el nivel freático dentro de la zona de raíces (70 cm). El banano tolera como máximo 2 días."
      en: "Soil saturated with water, with the water table inside the root zone (70 cm). Banana tolerates 2 days at most."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Standard term pending Tyson's local vocabulary (5.6); the 2 days and 70 cm are Tyson's confirmed values."
    task_id: T-061
    approved_by: null

  - term_id: lote
    term: {es: "Lote", en: "Lot"}
    definition:
      es: "Parte de la finca que se maneja como una unidad (cosecha, labores, registros)."
      en: "Part of the farm managed as one unit (harvest, field work, records)."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Standard term pending Tyson's local vocabulary (5.6)."
    task_id: T-061
    approved_by: null

  - term_id: cuadrilla
    term: {es: "Cuadrilla", en: "Field crew"}
    definition:
      es: "Grupo de trabajadores que hace las labores de campo."
      en: "Group of workers who carry out field work."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Standard term pending Tyson's local vocabulary (5.6)."
    task_id: T-061
