# domain/thresholds.yaml - agronomic thresholds and regional defaults (owner: agronomist agent).
# Schema: docs/contracts/schemas/domain/thresholds.schema.json; model: pipeline/common/models.py ThresholdsFile.
# Alert-index weights and W thresholds are NOT here: they belong to data-scientist in config/alerts.yaml.
# No human agronomist is on the team since 14 Nov 2026 (D-022, D-025). Every item is reviewed by agents only:
# reviewed_by [agronomist-agent, scientist-reviewer], human_review none. approved_by stays null until a future local
# agronomist reviews it. The former team agronomist's confirmed answers are origin "sourced" with source
# "team agronomist, 14 Nov 2026" (closed archive: domain/agronomist-answers-archive.md; DATA_POLICY.md §5).
# Questionnaire 5.1-5.10 is closed: defaults are the v1 values, origin "estimated", reason "team agronomist left;
# default retained" (DATA_POLICY.md §4, D-023). Statements without an opened source carry the label
# "General guidance — not reviewed by an agronomist". Open questions: domain/review-queue.md (nothing waits on them).

thresholds:

  # --- Waterlogging (team agronomist, 14 Nov 2026) -----------------------------------------------------
  waterlogging_tolerance_days:
    value: 2
    unit: d
    origin: sourced
    source: "team agronomist, 14 Nov 2026"
    reason: "Banana tolerates at most 2 days of waterlogging (closed archive, domain/agronomist-answers-archive.md)."
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  root_zone_depth_cm:
    value: 70
    unit: cm
    origin: sourced
    source: "team agronomist, 14 Nov 2026"
    reason: "Banana roots reach 70 cm (closed archive, domain/agronomist-answers-archive.md)."
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  waterlogging_damage_rule:
    value: "Damage line: water table shallower than root_zone_depth_cm for more than waterlogging_tolerance_days consecutive days (damage from day 3)."
    origin: sourced
    source: "team agronomist, 14 Nov 2026; combined as stated in SPEC section 08 (Thresholds, now set)"
    reason: "Combination of the two archived values. Whether damage starts on day 3 (more than 2 days) or day 2 (2 days or more) is an open question for a future local agronomist (review-queue.md Q-01)."
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none

  # --- Black Sigatoka side indicator (experimental, nice-to-have) --------------------------------------
  sigatoka_watch_mean_temp_c:
    value: 23
    unit: "°C"
    origin: estimated
    estimated_by: "research proposal in the team agronomist's archived notes (domain/agronomist-answers-archive.md; SPEC section 08)"
    reason: "General guidance — not reviewed by an agronomist. Experimental. Watch when daily mean temperature is above this value. Attributed to TEC Costa Rica and Atena papers (SPEC section 29) that the agronomist agent could not text-read (P-004), so the value is not cited as sourced."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  sigatoka_watch_rh_pct:
    value: 75
    unit: "%"
    origin: estimated
    estimated_by: "research proposal in the team agronomist's archived notes (domain/agronomist-answers-archive.md; SPEC section 08)"
    reason: "General guidance — not reviewed by an agronomist. Experimental. Watch when mean relative humidity is above this value. Same source situation as sigatoka_watch_mean_temp_c."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  sigatoka_watch_requires_rain:
    value: true
    origin: estimated
    estimated_by: "research proposal in the team agronomist's archived notes (domain/agronomist-answers-archive.md; SPEC section 08)"
    reason: "General guidance — not reviewed by an agronomist. Experimental. Rain (wet leaves) on the same days is part of the proposed Watch condition; the leaf-wetness papers found on 2026-11-15 could not be opened (HTTP 403 or captcha)."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  sigatoka_watch_consecutive_days:
    value: 3
    unit: d
    origin: estimated
    estimated_by: "research proposal in the team agronomist's archived notes (domain/agronomist-answers-archive.md)"
    reason: "General guidance — not reviewed by an agronomist. Experimental (DATA_POLICY.md §4). Watch after 3 consecutive days meeting the temperature, humidity and rain conditions."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  sigatoka_unfavourable_rh_pct:
    value: 70
    unit: "%"
    origin: estimated
    estimated_by: "research proposal in the team agronomist's archived notes (domain/agronomist-answers-archive.md; SPEC section 08)"
    reason: "General guidance — not reviewed by an agronomist. Experimental. Below this mean relative humidity conditions are unfavourable for the disease. Same source situation as sigatoka_watch_mean_temp_c."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none

  # --- Cool season and cold stress, El Oro (experimental, nice-to-have) --------------------------------
  cool_season_machala:
    value:
      start_month_day: "07-01"
      end_month_day: "11-13"
    origin: sourced
    source: "https://es.weatherspark.com/y/19338/Tiempo-promedio-en-Machala-Ecuador-durante-todo-el-a%C3%B1o"
    accessed: 2026-11-14
    reason: "WeatherSpark climatology for Machala: cool season 1 July to 13 November (4.4 months). Context for the cold-stress indicator."
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  coldest_month_mean_min_temp_c_machala:
    value: 21
    unit: "°C"
    origin: sourced
    source: "https://es.weatherspark.com/y/19338/Tiempo-promedio-en-Machala-Ecuador-durante-todo-el-a%C3%B1o"
    accessed: 2026-11-14
    reason: "WeatherSpark: August is the coldest month in Machala, mean daily minimum 21 °C."
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  cold_night_temp_c:
    value: 20
    unit: "°C"
    origin: estimated
    source: "https://www.ecuadortimes.net/low-temperatures-affect-the-banana-production/"
    accessed: 2026-11-14
    estimated_by: "agronomist agent from a producer report (Ecuador Times, 15 Nov 2010)"
    reason: "General guidance — not reviewed by an agronomist. Experimental. The article reports El Oro plantations at 20 °C at night with fruit not reaching normal thickness and a longer time to harvest. It is a producer report, not a trial, so it is not a sourced alert threshold."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  heat_unit_base_temp_c:
    value: 14
    unit: "°C"
    origin: estimated
    estimated_by: "research proposal in the team agronomist's archived notes (domain/agronomist-answers-archive.md: Ganry and Meyer 1975; CORBANA)"
    reason: "General guidance — not reviewed by an agronomist. Experimental. The CORBANA PDF could not be text-read (P-004) and Ganry and Meyer 1975 was not opened; the review opened on 2026-11-15 (Turner et al. 2007) uses growing-degree-days but states no base temperature."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none
  cold_stress_rule:
    value: "Weekly sum of heat units (base heat_unit_base_temp_c) compared with the climatology for the same week; a sum below climatology flags cold stress."
    origin: estimated
    estimated_by: "research proposal in the team agronomist's archived notes (domain/agronomist-answers-archive.md)"
    reason: "General guidance — not reviewed by an agronomist. Experimental method; how far below climatology counts as stress is not defined (review-queue.md Q-04)."
    task_id: T-065
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none

