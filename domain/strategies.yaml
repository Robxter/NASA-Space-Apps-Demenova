# domain/strategies.yaml - the three soil-management strategies (owner: agronomist; Tyson approves).
# Schema: docs/contracts/schemas/domain/strategies.schema.json.
# All three are drafts from Tyson's doc (domain/tyson-answers.md, "Research proposals awaiting his validation").
