  - practice_id: living_cover_mani_forrajero
    name_es: "Cobertura viva con maní forrajero (Arachis pintoi)"
    name_en: "Living cover with pinto peanut (maní forrajero, Arachis pintoi)"
    waterlogging_tolerance_days:
      value: 2
      unit: d
      origin: sourced
      source: "team agronomist, 14 Nov 2026"
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    root_depth_cm:
      value: 70
      unit: cm
      origin: sourced
      source: "team agronomist, 14 Nov 2026"
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    soil_benefits:
      value: "Ground cover against erosion: in a banana trial in northern New South Wales, Australia, the Arachis pintoi groundcover was always more than adequate to control erosion (Johns 1994). A review of Tropical American farming systems reports high potential as a cover crop in banana (De la Cruz, Suarez and Ferguson 1994). No opened study measures soil effects in El Oro banana."
      origin: sourced
      source: "https://connectsci.au/an/article/34/8/1197/153145/Effect-of-Arachis-pintoi-groundcover-on"
      accessed: 2026-11-15
      reason: "Abstracts opened on 2026-11-15 (Johns 1994; De la Cruz et al. 1994 via FAO AGRIS, listed in sources). Single-site and older studies; not from El Oro."
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    cost_usd_ha:
      value: null
      unit: "USD/ha"
      origin: pending
      reason: "Not estimated: no opened source gives costs for this practice in El Oro or Ecuador; no cost is invented."
      task_id: T-065
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    labour:
      value: null
      origin: pending
      reason: "Not estimated: no opened source gives labour for this practice."
      task_id: T-065
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    risks:
      value: "Slow establishment and possible competition for nutrients (De la Cruz et al. 1994). In the Johns 1994 trial, banana plants with the groundcover produced 9% fewer bunches than on bare soil, and the author notes competition for water may explain part of it. Many El Oro farms use it and many do not (team agronomist, 14 Nov 2026)."
      origin: sourced
      source: "https://agris.fao.org/search/es/records/6471eeb177fd37171a71944e"
      accessed: 2026-11-15
      reason: "Abstracts opened on 2026-11-15 (De la Cruz et al. 1994 via FAO AGRIS; Johns 1994, listed in sources). Study results are reported as found, not as a prediction for El Oro."
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    sources:
      - citation: "team agronomist, 14 Nov 2026"
        url: null
        accessed: null
      - citation: "Johns, G.G. (1994). Effect of Arachis pintoi groundcover on performance of bananas in northern New South Wales. Australian Journal of Experimental Agriculture 34(8), 1197-1204. doi:10.1071/EA9941197"
        url: "https://connectsci.au/an/article/34/8/1197/153145/Effect-of-Arachis-pintoi-groundcover-on"
        accessed: 2026-11-15
      - citation: "De la Cruz, R., Suarez, S., Ferguson, J.E. (1994). The contribution of Arachis pintoi as a ground cover in some farming systems of Tropical America. In: Biology and agronomy of forage Arachis, CIAT, 102-108 (FAO AGRIS record)."
        url: "https://agris.fao.org/search/es/records/6471eeb177fd37171a71944e"
        accessed: 2026-11-15
    approved_by: null
    reviewed_by: [agronomist-agent, scientist-reviewer]
    human_review: none

