practices:

  - practice_id: drainage_improvement
    name_es: "Mejora del drenaje (limpieza y apertura de canales)"
    name_en: "Improved drainage (clearing and opening drains)"
    waterlogging_tolerance_days:
      value: 2
      unit: d
      origin: sourced
      source: "team agronomist, 14 Nov 2026"
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    root_depth_cm:
      value: 70
      unit: cm
      origin: sourced
      source: "team agronomist, 14 Nov 2026"
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    soil_benefits:
      value: "Lowers the water table faster after rain so the 70 cm root zone spends fewer days saturated; the aim is to stay within the 2-day tolerance (team agronomist, 14 Nov 2026). Oxygen deficiency quickly kills the banana root apex (Turner, Fortescue and Thomas 2007)."
      origin: estimated
      source: "https://www.scielo.br/j/bjpp/a/w6fWfdQLYKrby3L5m6xnvMP/?lang=en"
      accessed: 2026-11-15
      estimated_by: "agronomist agent from SPEC section 08 (water balance, damage line) and the opened review"
      reason: "General guidance — not reviewed by an agronomist. The root-oxygen statement is from the opened review (Braz. J. Plant Physiol. 19(4), 2007); the drainage effect itself has no measured value for El Oro."
      task_id: T-065
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    cost_usd_ha:
      value: null
      unit: "USD/ha"
      origin: pending
      reason: "Not estimated: no opened source gives drainage costs for El Oro or Ecuador; no cost is invented."
      task_id: T-065
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    labour:
      value: null
      origin: pending
      reason: "Not estimated: no opened source gives labour for this practice. Labour cost and staff shortage are adoption barriers (team agronomist, 14 Nov 2026)."
      task_id: T-065
      approved_by: null
      reviewed_by: [agronomist-agent, scientist-reviewer]
      human_review: none
    risks:
      value: "Drain depth and spacing for El Oro are not defined (questionnaire 5.4 closed without a value); badly placed drains may move water toward neighbouring lots."
      origin: estimated
      estimated_by: "agronomist agent draft"
      reason: "General guidance — not reviewed by an agronomist."
