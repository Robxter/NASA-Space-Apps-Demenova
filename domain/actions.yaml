# domain/actions.yaml - recommended action per alert level and mode (owner: agronomist; Tyson approves).
# Schema: docs/contracts/schemas/domain/actions.schema.json.
# Levels show as colour AND word in the UI: Normal (green / verde), Watch (yellow / Vigilancia, amarillo),
# Warning (orange / Aviso, naranja), Severe (red / Severo, rojo).
# Farmer mode = one action a farmer with no staff can do alone (questionnaire 5.9).
# Agronomist mode = fuller guidance (questionnaire 5.5).
# All drafts: origin estimated, approved_by null. No chemicals, no doses. No Fusarium TR4 biosecurity text until
# Tyson approves it (T-062). Spanish uses standard terms pending Tyson's local vocabulary (5.6).

actions:

  - level: normal
    mode: farmer
    text:
      es: "Todo normal. Mantén limpios los drenajes."
      en: "All normal. Keep the drains clear."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.9 (solo-farmer actions) pending; draft by the agronomist agent."
    task_id: T-061
    approved_by: null

  - level: normal
    mode: agronomist
    text:
      es: "Sin acción urgente. Rutina: revisar que drenajes y salidas estén limpios, registrar notas de campo (lecturas de nivel freático, análisis de suelo, fechas de bioinsumos) y planificar bioinsumos mientras el suelo no esté saturado."
      en: "No urgent action. Routine: check that drains and outlets are clear, log field notes (water table readings, soil analyses, bio-input dates) and plan bio-inputs while the soil is not saturated."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.5 (actions per level) pending; draft by the agronomist agent."
    task_id: T-061
    approved_by: null

  - level: watch
    mode: farmer
    text:
      es: "Puede venir agua. Hoy limpia las salidas de los drenajes de los lotes bajos."
      en: "Water may be coming. Today, clear the drain outlets of the low lots."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.9 (solo-farmer actions) pending; draft by the agronomist agent."
    task_id: T-061
    approved_by: null

  - level: watch
    mode: agronomist
    text:
      es: "Revisar a diario la lluvia aguas arriba y la humedad del suelo del lote. Limpiar salidas de drenaje, primero en lotes bajos y planos. Posponer drench de bioinsumos hasta que el suelo drene. Avisar a la cuadrilla que puede hacer falta trabajo de drenaje."
      en: "Check upstream rain and the lot's soil moisture daily. Clear drain outlets, low and flat lots first. Postpone bio-input drenches until the soil drains. Tell the crew that drainage work may be needed."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.5 (actions per level) pending; draft by the agronomist agent."
    task_id: T-061
    approved_by: null

  - level: warning
    mode: farmer
    text:
      es: "Riesgo de encharcamiento. Abre y limpia los drenajes hoy y revisa cada mañana si hay agua estancada."
      en: "Waterlogging risk. Open and clear the drains today and check every morning for standing water."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.9 (solo-farmer actions) pending; draft by the agronomist agent."
    task_id: T-061
    approved_by: null

  - level: warning
    mode: agronomist
    text:
      es: "Encharcamiento probable en los próximos días. Priorizar lotes con alta humedad del terreno: abrir y limpiar drenajes, revisar agua estancada cada mañana y contar los días con agua (tolerancia: 2 días). Posponer fertilización, bioinsumos y tránsito en lotes saturados. Evaluar cortar racimos cercanos a cosecha en lotes en riesgo si el acceso puede cortarse."
      en: "Waterlogging likely within days. Prioritise lots with high terrain wetness: open and clear drains, check for standing water each morning and count days with water (tolerance: 2 days). Postpone fertiliser, bio-inputs and field traffic on saturated lots. Consider cutting bunches close to harvest in at-risk lots if access may be lost."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.5 (actions per level) pending; draft by the agronomist agent."
    task_id: T-061
    approved_by: null

  - level: severe
    mode: farmer
    text:
      es: "Peligro de inundación. Primero la seguridad de las personas. Cuando sea seguro, abre los drenajes y anota cuántos días se queda el agua."
      en: "Flood danger. People's safety first. When it is safe, open the drains and note how many days the water stays."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.9 (solo-farmer actions) pending; draft by the agronomist agent."
    task_id: T-061
    approved_by: null

  - level: severe
    mode: agronomist
    text:
      es: "Inundación o encharcamiento de más de 2 días esperado o en curso. Primero la seguridad: nadie trabaja en agua corriendo. Cuando el agua lo permita, abrir salidas de drenaje en los lotes afectados y registrar la fecha de llegada del agua y los días que permanece (memoria de inundación). No aplicar fertilización ni bioinsumos en suelo saturado. Al bajar el agua, inspeccionar plantas y registrar daños por lote."
      en: "Flooding or waterlogging beyond 2 days expected or under way. Safety first: nobody works in flowing water. When water allows, open drain outlets on affected lots and record the date the water arrived and the days it stays (flood memory). Do not apply fertiliser or bio-inputs to saturated soil. When the water drops, inspect plants and record damage per lot."
    origin: estimated
    estimated_by: questionnaire-default
    reason: "Questionnaire 5.5 (actions per level) pending; draft by the agronomist agent."
    task_id: T-061
    approved_by: null
